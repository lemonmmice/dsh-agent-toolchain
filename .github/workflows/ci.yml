name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo sanity gate (syntax + no private refs)
        run: node scripts/check.mjs
      - name: Failure corpus unit test
        run: node lib/failure-corpus.test.mjs
        shell: bash
      - name: dsh-win-terminal-inspector unit test
        run: node plugins/dsh-win-terminal-inspector/test/inspector.test.mjs
        shell: bash
      - name: MCP server install + smoke
        run: |
          cd mcp
          npm install
          node smoke.mjs
        shell: bash
